name: Catalog

# Publishes the official catalog to GitHub Pages whenever an app changes on main.
# BusyHub picks new apps and updates up from there; no BusyHub release is needed.
on:
  push:
    branches: [main]
    paths:
      - apps/**
      - scripts/**
      - src/main/catalog.ts
      - src/main/catalog-feed.ts
      - assets/branding/**
      - .github/workflows/catalog.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    name: Build the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm apps:check
      - run: pnpm catalog:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/catalog

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
