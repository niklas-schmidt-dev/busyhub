name: Release

# Push a tag like v0.2.0 to build installers for every platform and publish them as a GitHub release.
# Releases are for BusyHub itself: apps reach people through the online catalog (catalog.yml) without one.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm apps:check
      - run: pnpm catalog:build
      - uses: actions/upload-artifact@v7
        with:
          name: catalog
          path: build/catalog
          include-hidden-files: true

  package:
    name: Package (${{ matrix.name }})
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Windows
            os: windows-latest
            target: --win
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: catalog
          path: build/catalog
      - run: pnpm build
      - name: Package
        shell: bash
        env:
          # With these repository secrets the macOS build is signed with the Developer ID and notarized, so it can
          # update itself (docs/macos-signing.md). Without them it stays ad-hoc signed. Only the macOS job sees them.
          MAC_CERTIFICATE: ${{ matrix.name == 'macOS' && secrets.MAC_CERTIFICATE || '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ matrix.name == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.name == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          args=(${{ matrix.target }} --publish never)
          if [ -n "$MAC_CERTIFICATE" ] && [ -n "$APPLE_TEAM_ID" ]; then
            export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            # The Team ID picks the Developer ID certificate over the ad-hoc default in electron-builder.yml.
            args+=(-c.mac.identity="$APPLE_TEAM_ID")
          else
            # electron-builder notarizes whenever these are set, which an ad-hoc build cannot pass.
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          pnpm exec electron-builder "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          # The latest*.yml files and block maps are what installed copies read to update themselves. Windows
          # updates through the combined x64 + Arm installer, BusyHub-windows-setup.exe, which latest.yml names.
          path: |
            release/BusyHub-*.dmg
            release/BusyHub-*.zip
            release/BusyHub-windows-*-setup.exe
            release/BusyHub-windows-setup.exe
            release/BusyHub-*.AppImage
            release/BusyHub-*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY"
          --title "BusyHub $GITHUB_REF_NAME"
          --generate-notes
