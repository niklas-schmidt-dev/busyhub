<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../../assets/branding/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/branding/favicon-32.png" />
    <!--
      The live view talks to the bar over ws:. busy-lib starts its stream worker from a data: URL, and protobufjs inside it
      generates its decoders with eval, hence 'unsafe-eval'. The page loads only bundled code and renders app data as text.
      App icons are data: URLs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:; worker-src 'self' blob: data:"
    />
    <title>BusyHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
